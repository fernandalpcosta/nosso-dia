<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nosso Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>

/* Layout: two tabs (Hoje / Jogos) over one phone-width column. Hoje = three ritual cards with their own hues; Jogos = the question-card game. */
:root {
  --bg: #f1eef8; --surface: #fbfaff; --ink: #221a3b; --muted: #625a7e; --line: #d9d3ea;
  --g: #f2a93b; --on-g: #2a1b00; --l: #2a9d9d; --on-l: #04201f; --p: #e0527a; --on-p: #2b0612; --m: #8e5bd6; --on-m: #ffffff;
  --a: #3a55ff; --on-a: #ffffff; --b: #ff5b49; --on-b: #15172b;
  --card: #15172b; --card-ink: #f4f5ff; --ok: #17835a;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16112a; --surface: #201a38; --ink: #f0ecff; --muted: #a79fc6; --line: #32295a;
    --g: #f5b658; --l: #4fc3c0; --p: #f07c9c; --m: #b794f0; --on-m: #1b1030;
    --a: #7b8cff; --on-a: #15172b; --b: #ff7c6b; --on-b: #15172b;
    --card: #f1f2ff; --card-ink: #15172b; --ok: #4fd1a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16112a; --surface: #201a38; --ink: #f0ecff; --muted: #a79fc6; --line: #32295a;
  --g: #f5b658; --l: #4fc3c0; --p: #f07c9c; --m: #b794f0; --on-m: #1b1030;
  --a: #7b8cff; --on-a: #15172b; --b: #ff7c6b; --on-b: #15172b;
  --card: #f1f2ff; --card-ink: #15172b; --ok: #4fd1a0; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 18px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#hoje { --font-display: "Gabarito", "Trebuchet MS", system-ui, sans-serif; }
#jogos { --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; }
.tabs { max-width: 520px; margin: 0 auto 16px; display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 9px; background: transparent; color: var(--muted); padding: 10px 12px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

#hoje .wrap{max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;}
#hoje h1,#hoje h2,#hoje h3{font-family: var(--font-display); margin: 0; text-wrap: balance;}
#hoje .head{display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;}
#hoje .head h1{font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;}
#hoje .clocks{display: flex; gap: 8px; flex-wrap: wrap;}
#hoje .clock{display: inline-flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-variant-numeric: tabular-nums;}
#hoje .clock b{color: var(--ink); font-weight: 700;}
#hoje .sun,#hoje .moon{width: 12px; height: 12px; border-radius: 50%; flex: none;}
#hoje .sun{background: var(--g);}
#hoje .moon{box-shadow: inset -4px -2px 0 0 var(--muted);}
#hoje .card{background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px;}
#hoje .card.g{background: color-mix(in srgb, var(--g) 10%, var(--surface));}
#hoje .card.l{background: color-mix(in srgb, var(--l) 10%, var(--surface));}
#hoje .card.p{background: color-mix(in srgb, var(--p) 9%, var(--surface));}
#hoje .tag{align-self: flex-start; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px;}
#hoje .g .tag{background: var(--g); color: var(--on-g);}
#hoje .l .tag{background: var(--l); color: var(--on-l);}
#hoje .p .tag{background: var(--p); color: var(--on-p);}
#hoje .card.m{background: color-mix(in srgb, var(--m) 9%, var(--surface));}
#hoje .m .tag{background: var(--m); color: var(--on-m);}
#hoje .lb-form{display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px;}
#hoje .lb-form .lbl{margin-bottom: 0;}
#hoje .card.m .row .link{align-self: auto;}
#hoje .card h2{font-size: 1.35rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15;}
#hoje .sub{margin: 0; color: var(--muted); font-size: 0.92rem;}
#hoje .lbl{font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px;}
#hoje textarea,#hoje input[type="text"],#hoje input[type="date"]{width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;}
#hoje textarea{min-height: 84px; resize: vertical;}
#hoje textarea:focus-visible,#hoje input:focus-visible,#hoje button:focus-visible{outline: 3px solid var(--ink); outline-offset: 2px;}
#hoje button{font: inherit; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 13px; font-weight: 500;}
#hoje button:disabled{opacity: 0.5; cursor: not-allowed;}
#hoje button[aria-pressed="true"]{background: var(--ink); color: var(--bg); border-color: var(--ink);}
#hoje .main{background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700;}
#hoje .row{display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}
#hoje .row > .grow{flex: 1; min-width: 0;}
#hoje .say{background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px;}
#hoje .say .who{font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; display: block;}
#hoje .say p{margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;}
#hoje .wait{color: var(--muted); font-size: 0.92rem; margin: 0;}
#hoje .note{font-size: 0.9rem; margin: 0; padding: 8px 10px; background: var(--bg); border-left: 4px solid var(--p); border-radius: 6px;}
#hoje .link{background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; font-size: 0.88rem; align-self: flex-start;}
#hoje .vault{display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto;}
#hoje .vault .day{font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;}
#hoje .q{font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; margin: 0; text-wrap: balance;}
#hoje .timer{font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 18vw, 4.4rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 0;}
#hoje .timer.done{color: var(--p);}
#hoje .stage{display: flex; flex-direction: column; gap: 10px; align-items: flex-start;}
#hoje .rule{font-size: 0.85rem; color: var(--muted); margin: 0;}
#hoje .plan{display: flex; flex-direction: column; gap: 10px;}
#hoje .item{background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;}
#hoje .item .when{font-size: 0.74rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);}
#hoje .item .name{font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;}
#hoje .item .count{font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em;}
#hoje .item .count small{font-family: var(--font-body); font-weight: 500; font-size: 0.85rem; color: var(--muted); letter-spacing: 0;}
#hoje .chips{display: flex; gap: 6px; flex-wrap: wrap;}
#hoje .chips button{border-radius: 999px; font-size: 0.85rem; padding: 6px 11px; text-align: left;}
#hoje .hist{margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem;}
#hoje .hist span{color: var(--muted);}
#hoje .empty{color: var(--muted); font-size: 0.92rem; margin: 0;}
#jogos .wrap{max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;}
#jogos h1,#jogos h2{font-family: var(--font-display); margin: 0; text-wrap: balance;}
#jogos .brand{font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px;}
#jogos .brand i{width: 10px; height: 10px; border-radius: 50%; background: var(--a); box-shadow: 14px 0 0 var(--b); margin-right: 14px; display: inline-block;}
#jogos .top{display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;}
#jogos .chip{font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);}
#jogos .dot{width: 8px; height: 8px; border-radius: 50%; background: var(--line);}
#jogos .dot.on{background: var(--ok);}
#jogos .hero h1{font-size: clamp(2rem, 9vw, 2.7rem); line-height: 1.02; font-weight: 800; letter-spacing: -0.03em;}
#jogos .hero p{margin: 10px 0 0; color: var(--muted); max-width: 34ch;}
#jogos .hero .why{margin-top: 8px;}
#jogos .panel{background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px;}
#jogos .lbl{font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px;}
#jogos input[type="text"]{width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px;}
#jogos input[type="text"]:focus-visible,#jogos button:focus-visible{outline: 3px solid var(--a); outline-offset: 2px;}
#jogos .code-in{text-transform: uppercase; letter-spacing: 0.25em; text-align: center; font-weight: 700;}
#jogos .seg{display: flex; gap: 6px; flex-wrap: wrap;}
#jogos .seg button{flex: 1 1 0; min-width: 0;}
#jogos button{font: inherit; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 12px; font-weight: 500;}
#jogos button[aria-pressed="true"]{background: var(--ink); color: var(--bg); border-color: var(--ink);}
#jogos button:disabled{opacity: 0.5; cursor: not-allowed;}
#jogos .btn-main{background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; padding: 13px 14px;}
#jogos .btn-ghost{background: transparent;}
#jogos .row{display: flex; gap: 10px;}
#jogos .row > *{min-width: 0;}
#jogos .row .grow{flex: 1;}
#jogos .or{text-align: center; color: var(--muted); font-size: 0.85rem;}
#jogos .note{font-size: 0.9rem; color: var(--muted); margin: 0;}
#jogos .note.warn{color: var(--ink); background: var(--bg); border-left: 4px solid var(--b); padding: 8px 10px; border-radius: 6px;}
#jogos .score{display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;}
#jogos .who{display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700;}
#jogos .who span{overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
#jogos .who.r{justify-content: flex-end;}
#jogos .sw{width: 14px; height: 14px; border-radius: 4px; flex: none;}
#jogos .sw.a{background: var(--a);}
#jogos .sw.b{background: var(--b);}
#jogos .sync{font-size: 0.8rem; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums;}
#jogos .sync b{font-family: var(--font-display); color: var(--ink); font-size: 1.1rem;}
#jogos .card{background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 22px 20px 18px; transform: rotate(-1.2deg); box-shadow: 0 14px 28px -14px rgba(10, 12, 40, 0.55); min-height: 250px; display: flex; flex-direction: column; justify-content: space-between; gap: 22px;}
#jogos .card.deal{animation: deal 0.32s ease-out;}
@keyframes deal{ from { transform: translateY(14px) rotate(2deg); opacity: 0.2; } to { transform: rotate(-1.2deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce){#jogos .card.deal{animation: none;}}
#jogos .card .meta{display: flex; justify-content: space-between; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; font-variant-numeric: tabular-nums;}
#jogos .card .q{font-family: var(--font-display); font-weight: 800; font-size: clamp(1.45rem, 6.4vw, 1.85rem); line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance; margin: 0;}
#jogos .card .alt{font-size: 0.9rem; opacity: 0.72; margin: 0; padding-top: 12px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 25%, transparent);}
#jogos .card.empty .q{font-size: 1.3rem;}
#jogos .picks{display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
#jogos .pick{padding: 16px 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; border: 0; overflow: hidden; text-overflow: ellipsis;}
#jogos .pick.a{background: var(--a); color: var(--on-a);}
#jogos .pick.b{background: var(--b); color: var(--on-b);}
#jogos .pick[aria-pressed="true"]{outline: 3px solid var(--ink); outline-offset: 2px; background-clip: padding-box;}
#jogos .pick.a[aria-pressed="true"]{background: var(--a); color: var(--on-a); border: 0;}
#jogos .pick.b[aria-pressed="true"]{background: var(--b); color: var(--on-b); border: 0;}
#jogos .ledger{display: flex; flex-direction: column; gap: 8px;}
#jogos .ledger .line{display: flex; align-items: center; gap: 8px; flex-wrap: wrap;}
#jogos .ledger .arrow{color: var(--muted);}
#jogos .verdict{font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.01em;}
#jogos .verdict.ok{color: var(--ok);}
#jogos .tones{display: flex; gap: 6px; flex-wrap: wrap;}
#jogos .tones button{padding: 6px 11px; font-size: 0.85rem; border-radius: 999px;}
#jogos .pass{text-align: center; align-items: center; padding: 28px 16px;}
#jogos .pass h2{font-size: 1.5rem;}
#jogos .big-code{font-family: var(--font-display); font-weight: 800; font-size: 2rem; letter-spacing: 0.22em; padding-left: 0.22em;}
#jogos .hidden-link{background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; font-size: 0.85rem;}
#jogos [hidden], #hoje [hidden] { display: none !important; }
#app-puzzle .imgs { display: grid; grid-template-columns: 1fr 1fr; }
#jogos .gamepick { max-width: 460px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px; }
#jogos .gamepick button { flex: 1 1 auto; min-width: 0; font: inherit; font-weight: 700; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 10px; }
#jogos .gamepick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#jogos .gamepick button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

#app-puzzle .lbl { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
#app-puzzle .pz-title { font-size: clamp(1.8rem, 8vw, 2.3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
#app-puzzle .pz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
#app-puzzle .legend { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; font-weight: 700; flex-wrap: wrap; }
#app-puzzle .legend .sw + .sw { margin-left: 6px; }
#app-puzzle .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
#app-puzzle .bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
#app-puzzle .board { position: relative; display: grid; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 2px solid var(--ink); background: var(--surface); }
#app-puzzle .ghost { position: absolute; inset: 0; background-image: var(--pz-img); background-size: 100% 100%; opacity: 0.28; pointer-events: none; }
#app-puzzle .cell { position: relative; min-width: 0; padding: 0; margin: 0; border: 1px dashed var(--line); border-radius: 0; background: transparent; cursor: pointer; }
#app-puzzle .cell:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#app-puzzle .cell.placed { border: 0; cursor: default; background-image: var(--pz-img); background-color: var(--surface); background-repeat: no-repeat; }
#app-puzzle .cell.placed:hover { background-color: var(--surface); }
#app-puzzle .cell:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
#app-puzzle .cell.shake { animation: pz-shake 0.3s; background: color-mix(in srgb, var(--b) 25%, transparent); }
#app-puzzle .board.done .cell { border: 0; }
#app-puzzle .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #fff; }
#app-puzzle .dot.a { background: var(--a); }
#app-puzzle .dot.b { background: var(--b); }
#app-puzzle .tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
#app-puzzle .piece { aspect-ratio: 1; min-width: 0; padding: 0; border: 2px solid var(--line); border-radius: 8px; background-image: var(--pz-img); background-color: var(--surface); background-repeat: no-repeat; cursor: pointer; }
#app-puzzle .piece:hover { border-color: var(--muted); }
#app-puzzle .piece.sel { border-color: var(--ink); outline: 3px solid var(--ink); outline-offset: 1px; transform: scale(1.06); }
#app-puzzle .preview { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
#jogos #app-puzzle .pz-ai .seg button { flex: 1 1 auto; }
#app-puzzle .pz-ai { display: flex; flex-direction: column; gap: 8px; }
#app-puzzle .pz-ai textarea { width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
#app-puzzle .pz-ai textarea:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#app-puzzle .filein { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
#app-puzzle .filebtn { flex: 1 1 0; min-width: 0; text-align: center; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-weight: 500; }
#app-puzzle .filein:focus-visible + .filebtn { outline: 3px solid var(--ink); outline-offset: 2px; }
@keyframes pz-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { #app-puzzle .cell.shake { animation: none; } #app-puzzle .piece.sel { transform: none; } }
#app-vod .lbl { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
#app-vod .pz-title { font-size: clamp(1.8rem, 8vw, 2.3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
#app-vod .pz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
#app-vod .legend { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 700; min-width: 0; }
#app-vod .lg { display: inline-flex; align-items: center; gap: 6px; }
#app-vod .bigpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#app-vod .bigpick button { padding: 26px 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; border: 0; }
#app-vod .bigpick .v { background: var(--a); color: var(--on-a); }
#app-vod .bigpick .d { background: var(--b); color: var(--on-b); }
#app-vod .vcard { background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 20px 20px 16px; min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; transform: rotate(-1deg); box-shadow: 0 14px 28px -14px rgba(10, 12, 40, 0.55); }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

(function () {
  "use strict";

  var PROMPTS = [
    "Qual foi o melhor momento do seu dia, por menor que seja?",
    "Como estão seu corpo e sua cabeça agora?",
    "O que te fez sorrir hoje?",
    "Tem algo que você está esperando com vontade?",
    "O que pesou um pouco hoje, sem precisar resolver?",
    "Qual foi a coisa mais diferente que você viu ou fez hoje?",
    "Do que você precisou hoje e talvez não percebeu?",
    "Qual pensamento ficou rodando na sua cabeça?",
    "O que você aprendeu hoje?",
    "O que você gostaria de lembrar deste dia?",
    "Como você está se sentindo em relação a nós esta semana?",
    "Que cena, som ou cheiro do seu dia você me mostraria se pudesse?",
    "Do que você sente saudade hoje?",
    "O que te deu energia hoje, e o que tirou?"
  ];
  var ITEMS = [
    { k: "e1", when: "A cada 2 semanas", name: "Encontro só dos dois", fallback: "Sem falar de rotina nem de trabalho." },
    { k: "e2", when: "A cada 2 meses", name: "Escapada de fim de semana", fallback: "Um fim de semana só de vocês, perto ou longe." },
    { k: "e3", when: "A cada 2 anos", name: "A viagem grande", fallback: "Aquela viagem que vale planejar com calma." }
  ];

  var S = {
    dbOk: undefined, myKey: null, people: {}, grat: [], plan: {}, done: [],
    db: null, room: null, sample: null,
    draft: "", vault: false, ls: null, dur: 5, first: "me",
    editing: null, eDate: "", eTitle: "", ideas: [], busy: false, note: "", nameDraft: ""
  };

  /* ---------- Datas ---------- */
  function pad(n) { return ("0" + n).slice(-2); }
  function ds(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseD(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ds(new Date()); }
  function daysUntil(s) { var n = new Date(); n = new Date(n.getFullYear(), n.getMonth(), n.getDate()); return Math.round((parseD(s) - n) / 86400000); }
  function fmt(s) { return parseD(s).toLocaleDateString("pt-BR", { day: "numeric", month: "short" }); }
  function fmtLong(s) { return parseD(s).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }); }
  function advance(k, s) {
    var n = new Date(); n = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var d = parseD(s); if (d < n) d = n;
    if (k === "e1") d.setDate(d.getDate() + 14);
    else if (k === "e2") d.setMonth(d.getMonth() + 2);
    else d.setFullYear(d.getFullYear() + 2);
    return ds(d);
  }
  function safe(id) { return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 120); }

  /* ---------- Pessoas ---------- */
  function me() { return S.people[S.myKey] || null; }
  function partnerKey() { for (var k in S.people) if (k !== S.myKey) return k; return null; }
  function partner() { var k = partnerKey(); return k ? S.people[k] : null; }
  function nameOf(k) { var p = S.people[k]; return (p && p.name) || "Alguém"; }

  /* ---------- DOM helper ---------- */
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === false || v == null) continue;
      if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  var app = document.getElementById("app-hoje");
  // Miniatura do mundinho: o mundo.js desenha aqui; o nó é reaproveitado a cada render.
  var miniHost = document.createElement("div");
  window.NossoDiaMini = miniHost;
  // Cartão "Lembra quando…?": o lembra.js desenha aqui; também é reaproveitado a cada render.
  var lembraHost = document.createElement("div");
  window.NossoDiaLembra = lembraHost;

  /* ---------- Relógios ---------- */
  function timeIn(tz) {
    try { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: tz || undefined }); } catch (e) { return ""; }
  }
  function hourIn(tz) {
    try { return +new Date().toLocaleTimeString("en-GB", { hour: "2-digit", hour12: false, timeZone: tz || undefined }).slice(0, 2); } catch (e) { return 12; }
  }
  function clockEl(id, label, tz) {
    var day = hourIn(tz) >= 6 && hourIn(tz) < 19;
    return h("span", { class: "clock", id: id }, [h("i", { class: day ? "sun" : "moon" }), label + " ", h("b", { text: timeIn(tz) })]);
  }
  function tick() {
    var m = me(), p = partner();
    var a = document.getElementById("clk-me"), b = document.getElementById("clk-you");
    if (a && m) { var n = clockEl("clk-me", "Aqui", m.tz); a.replaceWith(n); }
    if (b && p) { var n2 = clockEl("clk-you", "Aí", p.tz); b.replaceWith(n2); }
    if (S.ls && !S.ls.ended) {
      var rem = remaining();
      var t = document.getElementById("timer");
      if (t) t.textContent = mmss(rem);
      if (rem <= 0) {
        S.ls.ended = true;
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
        // As duas falaram: nasce uma árvore no mundinho (o id da sessão evita árvore em dobro).
        if (S.ls.turn === 2 && S.ls.sid && window.NossoMundo) window.NossoMundo.grow("arvore", "escuta_" + S.ls.sid);
        render();
      }
    }
  }
  function remaining() { return Math.max(0, S.ls.dur * 60 - Math.floor((Date.now() - S.ls.startedAt) / 1000)); }
  function mmss(s) { return Math.floor(s / 60) + ":" + pad(s % 60); }

  /* ---------- Escritas ---------- */
  function fail(e) {
    S.note = "Não consegui salvar. Confira a internet e tente de novo.";
    render();
  }
  function saveName() {
    var name = (S.nameDraft || "").trim().slice(0, 24);
    if (!name) return;
    var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    S.db.doc("people/" + S.myKey).set({ name: name, tz: tz, at: Date.now() }).catch(fail);
  }
  function saveGrat() {
    var text = (S.draft || "").trim().slice(0, 500);
    if (!text) return;
    var d = today();
    S.db.doc("gratitude/" + d + "_" + S.myKey).set({ uid: S.myKey, date: d, text: text, at: Date.now() }).then(function () { S.draft = ""; }).catch(fail);
  }
  function savePlan(k, val) {
    var next = JSON.parse(JSON.stringify(S.plan || {}));
    next[k] = val;
    return S.db.doc("plan/current").set(next);
  }
  function savePlanEdit() {
    if (!S.eDate) { S.note = "Escolha uma data."; render(); return; }
    var k = S.editing;
    savePlan(k, { date: S.eDate, title: (S.eTitle || "").trim().slice(0, 80) }).then(function () { S.editing = null; S.ideas = []; S.note = ""; render(); }).catch(fail);
  }
  function markDone(k) {
    var it = S.plan[k]; if (!it) return;
    var def = ITEMS.filter(function (x) { return x.k === k; })[0];
    S.db.collection("done").add({ kind: def.name, title: it.title || "", date: it.date, at: Date.now(), by: S.myKey })
      .then(function () { return savePlan(k, { date: advance(k, it.date), title: "" }); })
      .catch(fail);
  }
  async function askIdeas() {
    if (!S.sample || S.busy) return;
    S.busy = true; S.note = ""; render();
    var prompt =
      "Sugira 4 ideias curtas de encontro virtual para um casal que mora em países diferentes. " +
      "O objetivo é se divertir e fazer algo diferente, sem falar de rotina, trabalho ou problemas. " +
      "Cada ideia tem no máximo 60 caracteres, começa com um verbo e dá para fazer por videochamada. " +
      (S.ideas.length ? "Não repita: " + S.ideas.join(" | ") + ". " : "") +
      "Responda só com um array JSON de 4 strings.";
    try {
      var out = await S.sample.json(prompt, { modelTier: "quick", cache: false });
      if (!Array.isArray(out)) throw new Error("shape");
      S.ideas = out.slice(0, 4).map(function (x) { return String(x).slice(0, 80); });
    } catch (e) {
      S.note = "Não consegui gerar ideias agora. Tente de novo em instantes.";
    }
    S.busy = false; render();
  }

  /* ---------- Escuta (sincronizada pela sala) ---------- */
  function startListen(speakerKey, turn, sid) {
    sid = sid || (Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    var msg = { type: "start", speaker: speakerKey, dur: S.dur, turn: turn, sid: sid };
    S.ls = { speaker: speakerKey, dur: S.dur, turn: turn, sid: sid, startedAt: Date.now(), ended: false };
    if (S.room) S.room.emit("listen", msg).catch(function () {});
    render();
  }
  function stopListen() {
    S.ls = null;
    if (S.room) S.room.emit("listen", { type: "stop" }).catch(function () {});
    render();
  }
  function onListen(m) {
    if (m.isMe || m.sameTab) return;
    var d = m.data;
    if (!d) return;
    if (d.type === "stop") { S.ls = null; render(); return; }
    if (d.type === "start" && typeof d.speaker === "string") {
      var dur = d.dur === 3 ? 3 : 5;
      var sid = typeof d.sid === "string" && /^[a-z0-9]{4,24}$/.test(d.sid) ? d.sid : "";
      S.ls = { speaker: d.speaker, dur: dur, turn: d.turn === 2 ? 2 : 1, sid: sid, startedAt: Date.now(), ended: false };
      render();
    }
  }

  /* ---------- Cartões ---------- */
  function cardGratidao() {
    var m = me(), p = partner(), pk = partnerKey(), d = today();
    var mine = S.grat.filter(function (g) { return g.date === d && g.uid === S.myKey; })[0];
    var theirs = pk ? S.grat.filter(function (g) { return g.date === d && g.uid === pk; })[0] : null;
    var kids = [h("span", { class: "tag", text: "Todo dia" }), h("h2", { text: "Uma coisa que eu valorizo em você" }), window.NossoDiaPorque ? window.NossoDiaPorque.button("gratidao") : null,
      h("p", { class: "sub", text: "Pode ser algo de hoje ou um jeito seu. Vocês só leem a resposta um do outro depois de escrever a sua." })];

    if (!mine) {
      kids.push(h("div", null, [h("label", { class: "lbl", for: "gratText", text: "Hoje eu sou grato(a) por…" }),
        h("textarea", { id: "gratText", maxlength: "500", oninput: function (e) { S.draft = e.target.value; } }, [])]));
      kids.push(h("div", { class: "row" }, [h("button", { type: "button", class: "main", disabled: !m, text: "Guardar", onclick: saveGrat })]));
      if (theirs) kids.push(h("p", { class: "wait", text: nameOf(pk) + " já escreveu hoje. Escreva a sua para ler." }));
      else if (p) kids.push(h("p", { class: "wait", text: nameOf(pk) + " ainda não escreveu hoje." }));
    } else {
      kids.push(h("div", { class: "say" }, [h("span", { class: "who", text: "Você" }), h("p", { text: mine.text })]));
      if (theirs) kids.push(h("div", { class: "say" }, [h("span", { class: "who", text: nameOf(pk) }), h("p", { text: theirs.text })]));
      else kids.push(h("p", { class: "wait", text: p ? "Esperando " + nameOf(pk) + " escrever a dela ou dele." : "Esperando a outra pessoa entrar." }));
    }

    kids.push(h("button", { type: "button", class: "link", text: S.vault ? "Fechar o cofre" : "Abrir o cofre de gratidão", onclick: function () { S.vault = !S.vault; render(); } }));
    if (S.vault) {
      var past = S.grat.filter(function (g) { return g.date !== d; });
      // Hide the partner's entries for days where I wrote nothing.
      var mineDays = {}; S.grat.forEach(function (g) { if (g.uid === S.myKey) mineDays[g.date] = true; });
      past = past.filter(function (g) { return g.uid === S.myKey || mineDays[g.date]; });
      if (!past.length) kids.push(h("p", { class: "empty", text: "Os dias anteriores aparecem aqui. Releia nos dias difíceis." }));
      else {
        var box = h("div", { class: "vault" });
        var lastDay = "";
        past.forEach(function (g) {
          if (g.date !== lastDay) { box.appendChild(h("div", { class: "day", text: fmt(g.date) })); lastDay = g.date; }
          box.appendChild(h("div", { class: "say" }, [h("span", { class: "who", text: g.uid === S.myKey ? "Você" : nameOf(g.uid) }), h("p", { text: g.text })]));
        });
        kids.push(box);
      }
    }
    return h("section", { class: "card g" }, kids);
  }

  function cardEscuta() {
    var p = partner(), pk = partnerKey();
    var idx = Math.floor((Date.now() / 86400000)) % PROMPTS.length;
    var kids = [h("span", { class: "tag", text: "No fim do dia" }), h("h2", { text: "5 minutos de escuta" }), window.NossoDiaPorque ? window.NossoDiaPorque.button("escuta") : null,
      h("p", { class: "q", text: PROMPTS[idx] })];

    if (!S.ls) {
      kids.push(h("div", null, [h("span", { class: "lbl", text: "Tempo de cada um" }),
        h("div", { class: "row" }, [3, 5].map(function (n) {
          return h("button", { type: "button", "aria-pressed": S.dur === n ? "true" : "false", text: n + " min", onclick: function () { S.dur = n; render(); } });
        }))]));
      kids.push(h("div", null, [h("span", { class: "lbl", text: "Quem fala primeiro" }),
        h("div", { class: "row" }, [
          h("button", { type: "button", "aria-pressed": S.first === "me" ? "true" : "false", text: "Eu", onclick: function () { S.first = "me"; render(); } }),
          h("button", { type: "button", "aria-pressed": S.first === "you" ? "true" : "false", disabled: !p, text: p ? p.name : "A outra pessoa", onclick: function () { S.first = "you"; render(); } })
        ])]));
      kids.push(h("div", { class: "row" }, [h("button", { type: "button", class: "main", disabled: !me() || (S.first === "you" && !pk), text: "Começar", onclick: function () { startListen(S.first === "me" ? S.myKey : pk, 1); } })]));
      kids.push(h("p", { class: "rule", text: "Quem ouve só ouve: sem conselho, sem interromper, sem mudar de assunto." }));
    } else {

  }

  /* ---------- Cartas ---------- */
  function setCard(card, fromPeer) {
    S.card = card; S.picks = [null, null]; S.passing = false; S.turn = 0; S.dealt = true; S.n += 1;
    if (S.early && S.early.cardId === card.id) { S.picks[1] = S.early.idx; }
    S.early = null;
    S.recent.push(card.tx.pt || card.tx.en); if (S.recent.length > 8) S.recent.shift();
    if (!fromPeer) broadcastCard(card);
    render();
  }
  function broadcastCard(card) {
    if (S.room) S.room.emit("card", { id: card.id, tone: card.tone, tx: card.tx }).catch(function () {});
  }

  function drawDeck() {
    var pool = DECK.filter(function (c) { return !S.used[c.id] && (S.tone === "any" ? c.tone !== "spicy" : c.tone === S.tone); });
    if (!pool.length) {
      DECK.forEach(function (c) { if (S.tone === "any" ? c.tone !== "spicy" : c.tone === S.tone) delete S.used[c.id]; });
      pool = DECK.filter(function (c) { return S.tone === "any" ? c.tone !== "spicy" : c.tone === S.tone; });
    }
    var c = pool[Math.floor(Math.random() * pool.length)];
    S.used[c.id] = true;
    S.note = "";
    setCard({ id: c.id, tone: c.tone, tx: c.tx }, false);
  }

  async function drawAI() {
    if (!S.sample || S.busy) return;
    S.busy = true; S.note = ""; render();
    var toneTxt = S.tone === "any" ? "qualquer clima, surpreenda, mas sem conteúdo picante" : S.tone === "spicy" ? "picante: flerte, provocação e sensualidade entre adultos que namoram. Sugestivo e divertido, sem descrever atos sexuais de forma explícita" : UI.pt.tones[S.tone];
    var prompt =
      "Crie UMA pergunta para o jogo “Quem é mais provável de…” entre duas pessoas que se conhecem bem e moram em países diferentes.\n" +
      "Clima: " + toneTxt + ".\n" +
      "Regras: curta, concreta, fácil de responder apontando para uma das duas pessoas, sem ofender ninguém. " +
      "Comece com “Quem é mais provável de” e termine com ?. Escreva a mesma pergunta em português, espanhol e inglês, naturais em cada idioma.\n" +
      (S.recent.length ? "Não repita nem se aproxime destas: " + S.recent.join(" | ") + "\n" : "") +
      "Responda somente com JSON neste formato: {\"pt\":\"...\",\"es\":\"...\",\"en\":\"...\"}";
    try {
      var out = await S.sample.json(prompt, { modelTier: "quick", cache: false });
      if (!out || !out.pt || !out.es || !out.en) throw new Error("shape");
      var id = "ai" + Date.now().toString(36);
      S.busy = false;
      setCard({ id: id, tone: S.tone, tx: { pt: String(out.pt).slice(0, 220), es: String(out.es).slice(0, 220), en: String(out.en).slice(0, 220) } }, false);
    } catch (e) {
      S.busy = false;
      if (e && e.code === "not_granted") S.sample = null;
      drawDeck();
      S.note = t("aiFail"); render();
    }
  }

  /* ---------- Respostas ---------- */
  function choose(idx) {
    if (!S.card) return;
    if (S.local) {
      S.picks[S.turn] = idx;
      if (S.turn === 0) { S.passing = true; S.turn = 1; }
      else afterPick();
      render();
      return;
    }
    if (S.picks[0] !== null) return;
    S.picks[0] = idx;
    if (S.room) S.room.emit("pick", { cardId: S.card.id, who: idx === 0 ? "me" : "you" }).catch(function () {});
    afterPick();
    render();
  }
  function revealed() { return S.picks[0] !== null && S.picks[1] !== null; }
  function afterPick() {
    if (revealed() && S.card && !S.counted[S.card.id]) {
      S.counted[S.card.id] = true;
      S.total += 1;
      if (S.picks[0] === S.picks[1]) {
        S.agree += 1;
        if (window.NossoMundo) window.NossoMundo.grow("passaro", "sint_" + (S.local ? "local" : S.code) + "_" + new Date().toISOString().slice(0, 10) + "_" + S.card.id);
      }
    }
  }

    return h("div", { class: "top" }, [h("div", { class: "brand" }, [h("i"), "Mais Provável"]), extra, window.NossoDiaPorque ? window.NossoDiaPorque.button("maisprovavel") : null]);
  }

    });

  }

  function viewHome() {

    var kids = [
      brandBar(null),
      h("div", { class: "hero" }, [h("h1", { text: "Quem é mais provável?" }), h("p", { text: t("tag") })]),
      h("div", { class: "panel" }, [
        h("div", null, [h("label", { class: "lbl", for: "name", text: t("yourName") }), nameIn]),
        h("div", null, [h("span", { class: "lbl", text: t("yourLang") }), langSeg()]),

        S.roomApi === null ? h("p", { class: "note", text: t("offline") }) : null

      h("button", { type: "button", class: "btn-ghost", text: t("local"), onclick: function () { S.view = "local"; S.note = ""; render(); } })

      brandBar(null),
      h("div", { class: "panel" }, [
        h("div", null, [h("label", { class: "lbl", for: "n1", text: t("yourName") }), n1]),
        h("div", null, [h("label", { class: "lbl", for: "n2", text: t("otherName") }), n2]),
        h("div", null, [h("span", { class: "lbl", text: t("yourLang") }), langSeg()]),
        S.note ? h("p", { class: "note warn", role: "status", text: S.note }) : null,
        h("button", { type: "button", class: "btn-main", text: t("start"), onclick: function () {
          if (!S.name || !S.name2) { S.note = t("needName"); render(); return; }
          S.local = true; S.view = "game"; S.note = ""; S.card = null; S.picks = [null, null]; S.turn = 0; S.passing = false; S.total = 0; S.agree = 0; S.n = 0; S.counted = {}; render();
        } }),
        h("button", { type: "button", class: "btn-ghost", text: t("back"), onclick: function () { S.view = "home"; S.note = ""; render(); } })
      ])
    ];
  }

  function viewGame() {
    var nm = names();
    var kids = [];
    var chip = null;
    if (!S.local) {
      chip = h("span", { class: "chip" }, [h("span", { class: "dot" + (S.partnerOnline ? " on" : "") }), S.partnerOnline ? t("online") : t("away")]);

    kids.push(h("div", { class: "score" }, [
      h("div", { class: "who" }, [h("i", { class: "sw a" }), h("span", { text: nm[0] })]),
      h("div", { class: "sync" }, [t("sync") + " ", h("b", { text: S.agree + "/" + S.total })]),
      h("div", { class: "who r" }, [h("span", { text: nm[1] }), h("i", { class: "sw b" })])
    ]));

    if (!S.local && !S.partnerOnline) {
      kids.push(h("div", { class: "panel pass" }, [h("p", { class: "note", role: "status", text: t("waiting") })]));
    }

    // passar o celular
    if (S.local && S.passing && S.card) {
      kids.push(h("div", { class: "panel pass" }, [
        h("h2", { text: t("passTo", { n: nm[1] }) }),
        h("p", { class: "note", text: t("passHint") }),
        h("button", { type: "button", class: "btn-main", text: t("ready"), onclick: function () { S.passing = false; render(); } })
      ]));
      return kids;
    }

    // carta
    var other = !S.local ? partnerLang() : null;
    var card;
    if (S.card) {
      var main = S.card.tx[S.lang] || S.card.tx.pt || S.card.tx.en;
      var alt = other && other !== S.lang ? S.card.tx[other] : "";
      card = h("div", { class: "card" + (S.dealt ? " deal" : ""), "aria-live": "polite" }, [
        h("div", { class: "meta" }, [h("span", { text: t("cardN", { n: S.n }) }), h("span", { text: S.card.tone && UI[S.lang].tones[S.card.tone] && S.card.tone !== "any" ? UI[S.lang].tones[S.card.tone] : "" })]),
        h("div", null, [h("p", { class: "q", text: main })]),
        alt ? h("p", { class: "alt", text: alt }) : null
      ]);
      S.dealt = false;
    } else {
      card = h("div", { class: "card empty" }, [
        h("div", { class: "meta" }, [h("span", { text: "Mais Provável" }), h("span", { text: "" })]),
        h("p", { class: "q", text: t("noCard") }),
        h("p", { class: "alt", text: t("pickHint") })
      ]);

    kids.push(card);

    // respostas

        var locked = !S.local && S.picks[0] !== null;
        kids.push(h("div", { class: "picks" }, [
          h("button", { type: "button", class: "pick a", disabled: locked && S.picks[0] !== 0, "aria-pressed": mine === 0 ? "true" : "false", text: nm[0], onclick: function () { choose(0); } }),
          h("button", { type: "button", class: "pick b", disabled: locked && S.picks[0] !== 1, "aria-pressed": mine === 1 ? "true" : "false", text: nm[1], onclick: function () { choose(1); } })
        ]));

        if (S.local) kids.push(h("p", { class: "note", text: nm[S.turn] + ": " + t("pickHint") }));
      } else {
        var p0 = S.picks[0], p1 = S.picks[1];

        if (p0 === p1) { verdict = t("agreeBoth", { n: nm[p0] }); ok = true; }
        else if (p0 === 0) verdict = t("eachSelf");
        else verdict = t("eachOther");
        function line(voter, sw, voted, swv) {
          return h("div", { class: "line" }, [h("i", { class: "sw " + sw }), h("b", { text: voter }), h("span", { class: "arrow", text: t("votedFor") }), h("i", { class: "sw " + swv }), h("b", { text: voted })]);
        }
        kids.push(h("div", { class: "panel ledger", "aria-live": "polite" }, [
          h("div", { class: "verdict" + (ok ? " ok" : ""), text: verdict }),
          line(nm[0], "a", nm[p0], p0 === 0 ? "a" : "b"),
          line(nm[1], "b", nm[p1], p1 === 0 ? "a" : "b")
        ]));
      }
    }

    // controles
    var tones = h("div", { class: "tones", role: "group", "aria-label": t("tone") });
    ["any", "fun", "apoc", "love", "absurd", "deep", "spicy"].forEach(function (k) {
      tones.appendChild(h("button", { type: "button", "aria-pressed": S.tone === k ? "true" : "false", text: UI[S.lang].tones[k], onclick: function () { S.tone = k; render(); } }));
    });
    var canDeal = S.local || S.partnerOnline || true;
    var ctrl = h("div", { class: "panel" }, [
      h("div", null, [h("span", { class: "lbl", text: t("tone") }), tones]),
      h("div", { class: "row" }, [
        h("button", { type: "button", class: "btn-main grow", disabled: S.busy || !canDeal, text: S.card ? t("next") : t("drawDeck"), onclick: drawDeck }),
        S.sample ? h("button", { type: "button", class: "grow", disabled: S.busy, text: S.busy ? t("generating") : t("drawAI"), onclick: drawAI }) : null
      ]),
      S.note ? h("p", { class: "note warn", role: "status", text: S.note }) : null
    ]);
    kids.push(ctrl);

    kids.push(h("button", { type: "button", class: "hidden-link", text: S.local ? t("back") : t("leave"), onclick: function () { if (S.local) { S.view = "home"; S.local = false; S.card = null; render(); } else leaveRoom(); } }));
    return kids;
  }

  function render() {
    var active = document.activeElement && document.activeElement.id;
    var kids = S.view === "home" ? viewHome() : S.view === "local" ? viewLocalSetup() : viewGame();
    app.textContent = "";
    kids.forEach(function (k) { if (k) app.appendChild(k); });
    if (active && (S.view === "home" || S.view === "local")) { var el = document.getElementById(active); if (el && el.tagName === "INPUT") { /* keep focus out of the way on rerender */ } }
  }

  render();

  /* ---------- Capacidades (podem não existir) ---------- */
  (async function () {
    var c = window.claude;
    if (!c || !c.use) { S.roomApi = null; S.sample = null; render(); return; }
    try { S.roomApi = (await c.use("room")) || null; } catch (e) { S.roomApi = null; }
    try { S.sample = (await c.use("sample")) || null; } catch (e) { S.sample = null; }
    if (S.view === "home") render(); else if (S.view === "game") render();
  })();
})();

<script>

(function(){
  var tabs = document.querySelectorAll(".tabs button");
  function show(id, save){
    ["hoje","jogos","mundo"].forEach(function(k){
      document.getElementById(k).hidden = (k !== id);
    });
    tabs.forEach(function(b){ b.setAttribute("aria-selected", b.getAttribute("data-tab") === id ? "true" : "false"); });
    if (save) { try { localStorage.setItem("nosso-dia-tab", id); } catch(e){} }
  }
  tabs.forEach(function(b){ b.addEventListener("click", function(){ show(b.getAttribute("data-tab"), true); }); });
  window.NossoDiaTabs = { show: function (id, save) { show(id, save); window.scrollTo(0, 0); } };
  var start = "hoje";
  try { var h = (location.hash || "").replace("#",""); if (h === "hoje" || h === "jogos" || h === "mundo") start = h; else { var s = localStorage.getItem("nosso-dia-tab"); if (s === "jogos" || s === "mundo") start = s; } } catch(e){}
  show(start, false);
})();

      var id = user ? await user.id() : null;
      if (!db || !id) { S.ok = false; render(); return; }
      S.db = db; S.myKey = safe(id); S.ok = true;
      try { S.sample = (await c.use("sample")) || null; } catch (e) { S.sample = null; }
      var onErr = function () { S.note = "A conexão falhou. Recarregue a página."; render(); };
      db.doc("puzzle/current").onSnapshot(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d) {
          var n = Math.floor(Number(d.size));
          if (typeof d.round !== "string" || !OKROUND.test(d.round) || typeof d.src !== "string" || !OKSRC.test(d.src) || !(n >= 3 && n <= 8)) d = null;
          else d = { round: d.round, size: n, src: d.src, by: d.by, at: Number(d.at) || 0 };
        }
        S.meta = d; applyImg(); render();
      }, onErr);
      db.doc("puzzle/current").collection("pieces").onSnapshot(function (snap) {
        S.pieces = snap.docs.map(function (x) { return x.data(); }); render();
      }, onErr);
      db.collection("people").onSnapshot(function (snap) {
        var o = {}; snap.docs.forEach(function (x) { o[x.id] = x.data(); }); S.people = o; render();
      }, function () {});
      render();
    } catch (e) { S.ok = false; render(); }
  })();
})();


(function(){
  var btns = document.querySelectorAll(".gamepick button");
  var panes = { cartas: document.getElementById("app-jogos"), puzzle: document.getElementById("app-puzzle"), vod: document.getElementById("app-vod") };
  function show(k, save){
    Object.keys(panes).forEach(function(key){ panes[key].hidden = (key !== k); });
    btns.forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-game") === k ? "true" : "false"); });
    if (save) { try { localStorage.setItem("nosso-dia-game", k); } catch(e){} }
  }
  btns.forEach(function(b){ b.addEventListener("click", function(){ show(b.getAttribute("data-game"), true); }); });
  var start = "cartas";
  try { var sg = localStorage.getItem("nosso-dia-game"); if (sg === "puzzle" || sg === "vod") start = sg; } catch(e){}

<script>
(function () {
  "use strict";
  var root = document.getElementById("app-vod");
  if (!root) return;

  var KINDS = { verdade: "Verdade", desafio: "Desafio" };
  var LEVELS = { fofo: "Fofo", divertido: "Divertido", picante: "Picante" };
  var OKKEY = /^[A-Za-z0-9_\-.~:@+]{1,120}$/;

  var DECK = {
    verdade: {
      fofo: [
        "Quando foi que você percebeu que estava gostando de mim de verdade?",
        "Qual é a primeira lembrança de nós que vem à sua cabeça?",
        "O que você mais sente falta em mim quando estamos longe?",
        "Qual detalhe meu você acha o mais fofo e nunca me contou?",
        "Qual música te lembra de mim, e por quê?",
        "Qual foi a coisa mais bonita que já fiz por você?"
      ],
      divertido: [
        "Qual foi a coisa mais vergonhosa que você já fez na frente de alguém de quem gostava?",
        "Qual hábito meu te dá mais vontade de rir?",
        "Se você pudesse trocar de vida comigo por um dia, o que faria primeiro?",
        "Qual é a mentirinha que você mais conta no dia a dia?",
        "Qual foi sua primeira impressão de mim, sem filtro?",
        "Qual foi a pior ideia de encontro que você já teve?"
      ],
      picante: [
        "O que você mais gosta de olhar em mim?",
        "Qual foi a primeira vez que você pensou em mim de um jeito mais ousado?",
        "Qual é a primeira coisa que você quer fazer quando a gente se reencontrar?",
        "O que eu faço que te deixa sem jeito, mas de um jeito bom?",
        "Qual foi o sonho mais ousado que você já teve comigo?",
        "O que te faz se sentir mais atraente?"
      ]
    },
    desafio: {
      fofo: [
        "Mande um áudio de 20 segundos contando por que você gosta de mim.",
        "Mostre pela câmera o objeto que mais te lembra de mim.",
        "Escreva uma mensagem de bom dia para mim como se fosse uma carta antiga.",
        "Faça um desenho nosso em 1 minuto e mostre pela câmera.",
        "Cante o refrão de uma música que te lembra de mim.",
        "Diga três coisas que admira em mim, olhando para a câmera."
      ],
      divertido: [
        "Imite meu jeito de falar por 30 segundos.",
        "Faça sua melhor dancinha de 15 segundos na câmera.",
        "Tente falar o alfabeto de trás para frente, sem errar.",
        "Coloque na cabeça algo que não seja chapéu e mostre pela câmera.",
        "Conte um filme inteiro usando só mímica, e eu adivinho.",
        "Mostre o que tem na sua geladeira agora e invente um prato com isso."
      ],
      picante: [
        "Mande um áudio com a sua voz mais sedutora dizendo o que vai fazer quando a gente se encontrar.",
        "Mande uma selfie com o seu melhor olhar de quem está provocando.",
        "Descreva em três frases o beijo perfeito.",
        "Faça um elogio bem ousado sobre o meu jeito, olhando para a câmera.",
        "Descreva nosso próximo encontro como uma cena de filme romântico.",
        "Dê um beijo de boa-noite na câmera, do jeito mais dramático que conseguir."
      ]
    }
  };

  var S = {
    ok: undefined, db: null, myKey: null, people: {}, st: null, sample: undefined,
    level: "fofo", ai: false, busy: false, note: "", confirm: false, used: {}, recent: []
  };

  function safe(id) { return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 120); }
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === false || v == null) continue;
      if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }

  /* ---------- Pessoas e turno ---------- */
  function partnerKey() {
    for (var k in S.people) if (k !== S.myKey) return k;
    return null;
  }
  function nameOf(key) {
    if (key === S.myKey) return "Você";
    var p = S.people[key];
    return (p && p.name) ? String(p.name).slice(0, 24) : "A outra pessoa";
  }
  function cur() {
    return S.st || { turn: S.myKey, phase: "pick", stats: {}, n: 0 };
  }
  function stat(key) {
    var s = cur().stats || {};
    var v = s[key] || {};
    return { d: +v.d || 0, s: +v.s || 0 };
  }

  /* ---------- Cartas ---------- */
  function pickDeck(kind, level) {
    var arr = DECK[kind][level], free = [], i;
    for (i = 0; i < arr.length; i++) if (!S.used[kind + level + i]) free.push(i);
    if (!free.length) { for (i = 0; i < arr.length; i++) delete S.used[kind + level + i]; free = arr.map(function (_, j) { return j; }); }
    var idx = free[Math.floor(Math.random() * free.length)];
    S.used[kind + level + idx] = true;
    return arr[idx];
  }
  async function draw(kind) {
    if (S.busy || !S.db) return;
    S.busy = true; S.note = ""; render();
    var text = null, src = "deck", level = S.level;
    if (S.ai && S.sample) {
      var prompt =
        "Crie UMA carta do jogo Verdade ou Desafio para duas pessoas que namoram e moram em países diferentes.\n" +
        "Tipo: " + (kind === "verdade" ? "uma pergunta de verdade" : "um desafio que dá para cumprir por chamada de vídeo ou mensagem") + ".\n" +
        "Nível: " + (level === "fofo" ? "fofo e carinhoso" : level === "divertido" ? "divertido e bobo" : "picante: flerte, provocação e sensualidade entre adultos, sugestivo, sem descrever atos sexuais de forma explícita") + ".\n" +
        "Regras: uma frase curta em português do Brasil, falando direto com a pessoa (\"você\"), sem adjetivos que marquem gênero, sem repetir estas: " + S.recent.join(" | ") + ".\n" +
        "Responda só com JSON: {\"text\":\"...\"}";
      try {
        var out = await S.sample.json(prompt, { modelTier: "quick", cache: false });
        if (out && typeof out.text === "string" && out.text.trim()) { text = out.text.trim().slice(0, 260); src = "ai"; }
      } catch (e) {
        if (e && e.code === "not_granted") S.sample = null;
        S.note = "Não consegui gerar agora. Usei uma carta do baralho.";
      }
    }
    if (!text) text = pickDeck(kind, level);
    S.recent.push(text); if (S.recent.length > 6) S.recent.shift();
    var base = cur();
    var doc = { turn: S.myKey, phase: "card", kind: kind, level: level, text: text, src: src, stats: base.stats || {}, n: (base.n || 0) + 1, at: Date.now() };
    S.st = doc; S.busy = false; render();
    save(doc);
  }
  function finish(done) {
    if (done && window.NossoMundo) window.NossoMundo.grow("borboleta", "vod_" + Date.now().toString(36) + "_" + S.myKey);
    var base = cur(), stats = JSON.parse(JSON.stringify(base.stats || {}));
    var me = stats[S.myKey] || { d: 0, s: 0 };
    if (done) me.d = (+me.d || 0) + 1; else me.s = (+me.s || 0) + 1;
    stats[S.myKey] = me;
    var doc = { turn: partnerKey() || S.myKey, phase: "pick", stats: stats, n: base.n || 0, at: Date.now() };
    S.st = doc; S.note = ""; render();
    save(doc);
  }
  function reset() {
    var doc = { turn: S.myKey, phase: "pick", stats: {}, n: 0, at: Date.now() };
    S.st = doc; S.confirm = false; S.note = ""; render();
    save(doc);
  }
  function save(doc) {
    S.db.doc("vod/current").set(doc).catch(function () {
      S.note = "Não consegui salvar. Confira a internet e tente de novo.";
      render();
    });
  }

  /* ---------- Telas ---------- */
  function legend() {
    var o = otherKey();
    var a = stat(S.myKey), b = o ? stat(o) : { d: 0, s: 0 };
    return h("span", { class: "legend" }, [
      h("span", { class: "lg" }, [h("i", { class: "sw a" }), "Você: " + a.d + " feitos, " + a.s + " passadas"]),
      h("span", { class: "lg" }, [h("i", { class: "sw b" }), (o ? nameOf(o) : "A outra pessoa") + ": " + b.d + " feitos, " + b.s + " passadas"])
    ]);
  }
  function otherKey() {
    var pk = partnerKey();
    if (pk) return pk;
    var t = cur().turn;
    return t && t !== S.myKey ? t : null;
  }

  function viewPick(mine, st) {
    var out = [];
    if (!mine) {
      out.push(h("div", { class: "panel pass" }, [
        h("h2", { text: "Vez de " + nameOf(st.turn) }),
        h("p", { class: "note", role: "status", text: "Esperando escolher verdade ou desafio. A carta aparece aqui na hora." })
      ]));
      return out;
    }
    var lv = h("div", { class: "seg", role: "group", "aria-label": "Nível" });
    Object.keys(LEVELS).forEach(function (k) {
      lv.appendChild(h("button", { type: "button", "aria-pressed": S.level === k ? "true" : "false", text: LEVELS[k], onclick: function () { S.level = k; render(); } }));
    });
    var panel = [
      h("div", null, [h("span", { class: "lbl", text: "Nível" }), lv])
    ];
    if (S.sample) {
      panel.push(h("div", { class: "row" }, [h("button", { type: "button", "aria-pressed": S.ai ? "true" : "false", text: S.ai ? "Carta com IA: ligada" : "Carta com IA: desligada", onclick: function () { S.ai = !S.ai; render(); } })]));
    }
    out.push(h("div", { class: "panel" }, panel));
    out.push(h("div", { class: "bigpick" }, [
      h("button", { type: "button", class: "v", disabled: S.busy, text: S.busy ? "Gerando…" : "Verdade", onclick: function () { draw("verdade"); } }),
      h("button", { type: "button", class: "d", disabled: S.busy, text: S.busy ? "Gerando…" : "Desafio", onclick: function () { draw("desafio"); } })
    ]));
    return out;
  }

  function viewCard(mine, st) {
    var out = [];
    var kind = KINDS[st.kind] ? st.kind : "verdade";
    out.push(h("div", { class: "vcard", "aria-live": "polite" }, [
      h("div", { class: "meta" }, [h("span", { text: KINDS[kind] + " · " + (LEVELS[st.level] || "") }), h("span", { text: "Carta " + (st.n || 1) })]),
      h("p", { class: "vq", text: st.text || "" }),
      h("div", { class: "meta" }, [h("span", { text: "Para " + (st.turn === S.myKey ? "você" : nameOf(st.turn)) }), h("span", { text: st.src === "ai" ? "feita pela IA" : "" })])
    ]));
    if (mine) {
      out.push(h("div", { class: "row" }, [
        h("button", { type: "button", class: "btn-main grow", text: kind === "verdade" ? "Respondi" : "Cumpri", onclick: function () { finish(true); } }),
        h("button", { type: "button", class: "grow", text: "Passar", onclick: function () { finish(false); } })
      ]));
    } else {
      out.push(h("p", { class: "note", role: "status", text: "Esperando " + nameOf(st.turn) + (kind === "verdade" ? " responder…" : " cumprir…") }));
    }
    return out;
  }

  function render() {
    var kids = [h("div", { class: "top" }, [h("div", { class: "brand" }, [h("i"), "Verdade ou desafio"])])];
    kids.push(h("div", { class: "hero" }, [h("h2", { class: "pz-title", text: "Verdade ou desafio" }), h("p", { text: "Uma pessoa por vez. A carta aparece para as duas." }), window.NossoDiaPorque ? window.NossoDiaPorque.button("vod") : null]));
    if (S.ok === undefined) kids.push(h("p", { class: "note", text: "Abrindo o jogo…" }));
    else if (S.ok === false) kids.push(h("p", { class: "note warn", text: "Para jogar juntas, os dados compartilhados precisam estar ligados. Veja em Ajustes, no fim da página." }));
    else {
      var st = cur(), mine = st.turn === S.myKey;
      kids.push(h("div", { class: "pz-top" }, [h("span", { class: "chip", text: mine ? "Sua vez" : "Vez de " + nameOf(st.turn) }), legend()]));
      if (!partnerKey()) kids.push(h("p", { class: "note", text: "Falta a outra pessoa entrar. Ela precisa abrir esta página e escrever o nome na aba Hoje." }));
      (st.phase === "card" ? viewCard(mine, st) : viewPick(mine, st)).forEach(function (k) { kids.push(k); });
      if (S.note) kids.push(h("p", { class: "note warn", role: "status", text: S.note }));
      if (!S.confirm) kids.push(h("button", { type: "button", class: "hidden-link", text: "Recomeçar o placar", onclick: function () { S.confirm = true; render(); } }));
      else kids.push(h("div", { class: "row" }, [
        h("button", { type: "button", text: "Apagar o placar e recomeçar", onclick: reset }),
        h("button", { type: "button", class: "btn-ghost", text: "Cancelar", onclick: function () { S.confirm = false; render(); } })
      ]));
    }
    root.textContent = "";
    kids.forEach(function (k) { if (k) root.appendChild(k); });
  }

  render();

  (async function () {
    var c = window.claude;
    if (!c || !c.use) { S.ok = false; render(); return; }
    try { S.sample = (await c.use("sample")) || null; } catch (e) { S.sample = null; }
    try {
      var db = await c.use("db"), user = await c.use("user");
      var id = user ? await user.id() : null;
      if (!db || !id) { S.ok = false; render(); return; }
      S.db = db; S.myKey = safe(id); S.ok = true;
      var onErr = function () { S.note = "A conexão falhou. Recarregue a página."; render(); };
      db.doc("vod/current").onSnapshot(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d && (d.phase === "pick" || d.phase === "card") && typeof d.turn === "string" && OKKEY.test(d.turn)) {
          var stats = {};
          if (d.stats && typeof d.stats === "object") for (var k in d.stats) if (OKKEY.test(k) && d.stats[k] && typeof d.stats[k] === "object") stats[k] = { d: +d.stats[k].d || 0, s: +d.stats[k].s || 0 };
          S.st = {
            turn: d.turn, phase: d.phase, stats: stats, n: Math.max(0, Math.floor(+d.n || 0)),
            kind: KINDS[d.kind] ? d.kind : "verdade", level: LEVELS[d.level] ? d.level : "fofo",
            text: typeof d.text === "string" ? d.text.slice(0, 300) : "", src: d.src === "ai" ? "ai" : "deck"
          };
        } else S.st = null;
        render();
      }, onErr);
      db.collection("people").onSnapshot(function (snap) {
        var o = {}; snap.docs.forEach(function (x) { o[x.id] = x.data(); }); S.people = o; render();
      }, function () {});
      render();
    } catch (e) { S.ok = false; render(); }
  })();
})();

</script>
